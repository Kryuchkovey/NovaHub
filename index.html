<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nova Hub</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div>

            <div class="logo">
                ✦ NOVA HUB
            </div>

            <div class="subtitle">
                Твой маленький мир
            </div>

        </div>


        <div class="avatar">
            N
        </div>

    </header>


    <!-- MAIN -->

    <main id="main-screen">

        <section class="welcome">

            <p class="hello">
                Добро пожаловать 👋
            </p>

            <h1>
                Готов начать?
            </h1>

            <p class="description">
                Исследуй приложение и открывай новые возможности.
            </p>

        </section>


        <!-- PROFILE -->

        <section
            class="profile-card"
            onclick="openProfile()"
        >

            <div class="profile-avatar">
                N
            </div>


            <div class="profile-info">

                <span>
                    Профиль
                </span>

                <strong>
                    Новый пользователь
                </strong>

                <small>
                    ⭐ 0 XP
                </small>

            </div>


            <button
                class="arrow"
                type="button"
            >
                ›
            </button>

        </section>


        <!-- MENU -->

        <section class="cards">

            <button
                class="menu-card"
                onclick="showMessage('Игры')"
            >

                <div class="card-icon">
                    🎮
                </div>

                <strong>
                    Игры
                </strong>

                <span>
                    Мини-игры
                </span>

            </button>


            <button
                class="menu-card"
                onclick="showMessage('Музыка')"
            >

                <div class="card-icon">
                    🎵
                </div>

                <strong>
                    Музыка
                </strong>

                <span>
                    Твои треки
                </span>

            </button>

        </section>


        <!-- START -->

        <button
            class="start-button"
            onclick="startApp()"
        >

            <span>
                🚀
            </span>

            Начать

        </button>

    </main>


    <!-- PROFILE SCREEN -->

    <div
        id="profile-screen"
        class="profile-screen"
    >

        <button
            class="back-button"
            onclick="closeProfile()"
        >
            ← Назад
        </button>


        <div class="profile-page">


            <!-- BIG AVATAR -->

            <div class="big-avatar">
                N
            </div>


            <!-- NAME -->

            <h2 id="profile-name">
                Новый пользователь
            </h2>


            <!-- USERNAME -->

            <p id="profile-username">
                @username
            </p>


            <!-- LEVEL -->

            <div class="level-card">

                <div class="level-header">

                    <span>
                        🏆 Уровень 1
                    </span>

                    <span>
                        0 / 100 XP
                    </span>

                </div>


                <div class="progress">

                    <div
                        class="progress-bar"
                    ></div>

                </div>

            </div>


            <!-- STATS -->

            <div class="stats">
<button
    class="start-button"
    onclick="addXP(25)"
>
    ⭐ Получить 25 XP
</button>
                <div class="stat-card">

                    <strong id="profile-xp">
                        0
                    </strong>

                    <span>
                        ⭐ XP
                    </span>

                </div>


                <div class="stat-card">

                    <strong>
                        1
                    </strong>

                    <span>
                        🏆 Уровень
                    </span>

                </div>

            </div>


            <!-- TELEGRAM ID -->

            <div class="telegram-id">

                <span>
                    Telegram ID
                </span>

                <strong id="profile-id">
                    Неизвестно
                </strong>

            </div>

        </div>

    </div>


    <footer>
        Nova Hub • v1.0
    </footer>

</div>


<script src="script.js"></script>

</body>

</html>
